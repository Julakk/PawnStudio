<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PawnStudio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <div id="topbar">
      <span id="app-title">PawnStudio</span>
      <div id="topbar-actions">
        <button id="btn-run" title="Run">▶</button>
        <button id="btn-save" title="Save">💾</button>
      </div>
    </div>

    <!-- Editor container -->
    <div id="editor-container"></div>

    <!-- Bottom status bar -->
    <div id="statusbar">
      <span id="status-file">untitled.pwn</span>
      <span id="status-lang">PAWN</span>
    </div>
  </div>

  <!-- Monaco loader (CDN, AMD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
