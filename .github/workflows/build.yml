name: Build PawnStudio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (if not exists)
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Siapkan runtime Node.js (arm64-v8a)
        run: |
          NODE_MOBILE_VERSION=v18.20.4
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          JNI=android/app/src/main/jniLibs/arm64-v8a
          echo "NDK: $NDK"
          mkdir -p "$JNI" nodebuild
          curl -fsSL -o nodebuild/nm.zip "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${NODE_MOBILE_VERSION}/nodejs-mobile-${NODE_MOBILE_VERSION}-android.zip"
          unzip -q -o nodebuild/nm.zip "bin/arm64-v8a/libnode.so" -d nodebuild
          cp nodebuild/bin/arm64-v8a/libnode.so "$JNI/libnode.so"
          "$TOOLS/bin/llvm-strip" --strip-unneeded "$JNI/libnode.so"
          cp "$TOOLS/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/libc++_shared.so"
          "$TOOLS/bin/aarch64-linux-android26-clang" -O2 -o "$JNI/libnodeexec.so" android/native/nodeexec.c -ldl
          ls -la "$JNI"

      - name: Siapkan npm untuk app
        run: |
          mkdir -p nodebuild/npm android/app/src/main/assets/node
          cd nodebuild/npm
          npm pack npm@10.8.3 --silent
          tar xzf npm-10.8.3.tgz
          (cd package && zip -qr -9 ../../../android/app/src/main/assets/node/npm.zip .)
          ls -la ../../android/app/src/main/assets/node

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PawnStudio.apk

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PawnStudio
          path: dist/PawnStudio.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PawnStudio Build ${{ github.run_number }}
          files: dist/PawnStudio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
