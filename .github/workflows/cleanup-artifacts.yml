name: Cleanup All Artifacts (Emergency Storage Fix)

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete ALL artifacts in this repo
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            console.log(`Ditemukan ${artifacts.length} artifact, mulai hapus...`);
            for (const artifact of artifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                console.log(`Terhapus: ${artifact.name} (${artifact.id})`);
              } catch (error) {
                console.log(`Gagal hapus ${artifact.name}: ${error.message}`);
              }
            }
            console.log("Selesai.");
