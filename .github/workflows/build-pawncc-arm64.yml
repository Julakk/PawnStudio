name: Build pawncc for Android arm64-v8a

on:
  workflow_dispatch: {}

jobs:
  build-pawncc-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pawn-lang/compiler source
        uses: actions/checkout@v4
        with:
          repository: pawn-lang/compiler
          submodules: recursive

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Create pthread stub (Android has no separate libpthread)
        run: |
          mkdir -p stub-libs
          ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar crs stub-libs/libpthread.a

      - name: Configure with CMake (Android arm64-v8a)
        run: |
          mkdir build-android
          cd build-android
          cmake ../source/compiler \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-L${{ github.workspace }}/stub-libs" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L${{ github.workspace }}/stub-libs"

      - name: Build pawncc + libpawnc
        run: |
          cd build-android
          cmake --build . --config Release --target pawncc -- -j$(nproc)
          cmake --build . --config Release --target pawnc -- -j$(nproc)

      - name: List build output (debug helper)
        run: |
          find build-android -type f -executable -name "pawncc*"
          find build-android -type f -name "libpawnc.so"

      - name: Collect binary + shared library
        run: |
          mkdir -p output
          find build-android -type f -executable -name "pawncc*" -exec cp {} output/pawncc-arm64-v8a \;
          find build-android -type f -name "libpawnc.so" -exec cp {} output/libpawnc-arm64-v8a.so \;

      - name: Upload pawncc + libpawnc artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawncc-arm64-v8a-bundle
          path: |
            output/pawncc-arm64-v8a
            output/libpawnc-arm64-v8a.so
